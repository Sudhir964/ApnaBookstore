<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customer Login | ApnaBookstore</title>
	<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
	<link rel="manifest" href="./favicons/site.webmanifest">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="styles.css">
	<style>
		.auth-wrapper {
			min-height: calc(100vh - 80px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 16px;
		}
		.auth-card {
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 16px;
			box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
			max-width: 440px;
			width: 100%;
			padding: 36px 32px;
		}
		.auth-header {
			text-align: center;
			margin-bottom: 26px;
		}
		.auth-icon {
			width: 52px;
			height: 52px;
			border-radius: 14px;
			background: #eef2ff;
			color: #4f46e5;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 26px;
			margin: 0 auto 14px auto;
		}
		.auth-header h2 {
			font-size: 24px;
			font-weight: 700;
			color: #0f172a;
			margin-bottom: 6px;
		}
		.auth-header p {
			font-size: 14px;
			color: #64748b;
			margin: 0;
		}
		.role-switch-pill {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 10px;
			padding: 10px 14px;
			margin-bottom: 22px;
			font-size: 13.5px;
			text-align: center;
			color: #475569;
		}
		.role-switch-pill a {
			font-weight: 600;
			color: #4f46e5;
		}
		.captcha-row {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 20px;
		}
		#CaptchaDiv {
			flex: 1;
			text-align: center;
			background: #f1f5f9;
			color: #0f172a;
			font-weight: 800;
			font-size: 22px;
			letter-spacing: 4px;
			padding: 8px 12px;
			border-radius: 8px;
			border: 1.5px dashed #cbd5e1;
			user-select: none;
		}
		.auth-footer {
			text-align: center;
			margin-top: 22px;
			font-size: 14px;
			color: #64748b;
		}
	</style>
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-sm bg-dark">
			<a class="brand-container" href="index.html">
				<span class="brand-logo-text">ApnaBookstore</span>
				<span class="brand-badge">Store & Inventory</span>
			</a>
			
			<button class="navbar-toggler" style="background-color: white;" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">                
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
					<li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
					<li class="nav-item"><a class="nav-link" href="CustomerRegister.html">Register</a></li>
					<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
				</ul>
			</div>
		</nav>
	</header>

	<div class="auth-wrapper">
		<div class="auth-card">
			<div class="auth-header">
				<div class="auth-icon">
					<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
				</div>
				<h2>Customer Sign In</h2>
				<p>Access your ApnaBookstore customer account</p>
			</div>

			<div class="role-switch-pill">
				Store administrator? <a href="SellerLogin.html">Sign In as Admin</a>
			</div>

			<form action="userlog" method="post" id="theform" onsubmit="checkform()">
				<div class="form-group">
					<label for="userName">Username</label>
					<input type="text" name="username" id="userName" placeholder="Enter your username" required autofocus>
				</div>

				<div class="form-group">
					<label for="Password">Password</label>
					<input type="password" name="password" id="Password" placeholder="Enter your password" required>
				</div>

				<div class="form-group">
					<label for="CaptchaInput">Security Code</label>
					<div class="captcha-row">
						<div id="CaptchaDiv">46749</div>
						<input type="hidden" id="txtCaptcha" value="46749">
						<input type="text" name="CaptchaInput" id="CaptchaInput" placeholder="Enter code" style="margin: 0 !important; width: 140px !important;" required>
					</div>
				</div>

				<button type="submit" class="btn btn-primary btn-block" style="padding: 12px !important; font-size: 15px !important;">
					Sign In as Customer
				</button>
			</form>

			<div class="auth-footer">
				Don't have an account? <a href="CustomerRegister.html" style="font-weight: 600;">Create Account</a>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
	<script type="text/javascript">
		function checkform() {
			var theform = document.getElementById("theform");
			var why = "";

			if (theform.CaptchaInput.value == "") {
				why += "- Please Enter CAPTCHA Code.\n";
			}
			if (theform.CaptchaInput.value != "") {
				if (ValidCaptcha(theform.CaptchaInput.value) == false) {
					why += "- The CAPTCHA Code Does Not Match.\n";
				}
			}
			if (why != "") {
				alert(why);
				event.preventDefault();
				return false;
			}
			return true;
		}

		var a = Math.ceil(Math.random() * 9) + '';
		var b = Math.ceil(Math.random() * 9) + '';
		var c = Math.ceil(Math.random() * 9) + '';
		var d = Math.ceil(Math.random() * 9) + '';
		var e = Math.ceil(Math.random() * 9) + '';

		var code = a + b + c + d + e;
		document.getElementById("txtCaptcha").value = code;
		document.getElementById("CaptchaDiv").innerHTML = code;

		function ValidCaptcha() {
			var str1 = removeSpaces(document.getElementById('txtCaptcha').value);
			var str2 = removeSpaces(document.getElementById('CaptchaInput').value);
			return str1 === str2;
		}

		function removeSpaces(string) {
			return string.split(' ').join('');
		}
	</script>
</body>
</html>
