<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout & Payment | ApnaBookstore</title>
<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="manifest" href="./favicons/site.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="styles.css">
<style>
.checkout-wrapper {
	max-width: 960px;
	margin: 20px auto 40px auto;
}
.checkout-card {
	background: #ffffff;
	border: 1px solid #e2e8f0;
	border-radius: 16px;
	padding: 32px;
	box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
}
.section-title {
	font-size: 18px;
	font-weight: 700;
	color: #0f172a;
	margin-bottom: 20px;
	padding-bottom: 10px;
	border-bottom: 1.5px solid #f1f5f9;
	display: flex;
	align-items: center;
	gap: 8px;
}
.icon-container {
	margin-bottom: 16px;
	font-size: 24px;
	display: flex;
	gap: 12px;
}
.order-summary-box {
	background: #f8fafc;
	border: 1.5px dashed #cbd5e1;
	border-radius: 12px;
	padding: 16px 20px;
	margin-top: 20px;
	margin-bottom: 20px;
	font-size: 17px;
	font-weight: 600;
	display: flex;
	justify-content: space-between;
	align-items: center;
}
span.price {
	font-size: 20px;
	color: #10b981 !important;
	font-weight: 700;
}
</style>
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-sm bg-dark">
			<a class="brand-container" href="viewbook">
				<span class="brand-logo-text">ApnaBookstore</span>
				<span class="brand-badge">Customer Portal</span>
			</a>

			<button class="navbar-toggler" style="background-color: white;" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a class="nav-link" href="viewbook">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="viewbook">Available Books</a></li>
					<li class="nav-item"><a class="nav-link active" href="cart">Cart</a></li>
					<li class="nav-item"><a class="nav-link" href="about">About Us</a></li>
					<li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
				</ul>
			</div>
		</nav>
	</header>

	<div class="container checkout-wrapper">
		<div id="topmid">
			<span>Checkout & Payment</span>
			<a href="cart" class="btn btn-sm btn-light" style="font-size: 13px;">Back to Cart</a>
		</div>

		<div class="checkout-card">
			<form action="pay" method="post">
				<div class="row">
					<div class="col-md-6 mb-4">
						<h3 class="section-title">Billing & Delivery Address</h3>
						<div class="form-group">
							<label for="fname"><i class="fa fa-user"></i> Full Name</label>
							<input type="text" id="fname" name="firstname" placeholder="John M. Doe" required>
						</div>
						<div class="form-group">
							<label for="email"><i class="fa fa-envelope"></i> Email Address</label>
							<input type="email" id="email" name="email" placeholder="john@example.com" required>
						</div>
						<div class="form-group">
							<label for="adr"><i class="fa fa-address-card-o"></i> Street Address</label>
							<input type="text" id="adr" name="address" placeholder="542 W. 15th Street" required>
						</div>
						<div class="row">
							<div class="col-6">
								<div class="form-group">
									<label for="city">City</label>
									<input type="text" id="city" name="city" placeholder="New York" required>
								</div>
							</div>
							<div class="col-3">
								<div class="form-group">
									<label for="state">State</label>
									<input type="text" id="state" name="state" placeholder="NY" required>
								</div>
							</div>
							<div class="col-3">
								<div class="form-group">
									<label for="zip">Zip</label>
									<input type="text" id="zip" name="zip" placeholder="10001" required>
								</div>
							</div>
						</div>
					</div>

					<div class="col-md-6 mb-4">
						<h3 class="section-title">Payment Information</h3>
						<label>Accepted Payment Cards</label>
						<div class="icon-container">
							<i class="fa fa-cc-visa" style="color: #1a1f71;"></i>
							<i class="fa fa-cc-amex" style="color: #007bc1;"></i>
							<i class="fa fa-cc-mastercard" style="color: #eb001b;"></i>
							<i class="fa fa-cc-discover" style="color: #f9a01b;"></i>
						</div>
						<div class="form-group">
							<label for="cname">Cardholder Name</label>
							<input type="text" id="cname" name="cardname" placeholder="John More Doe" required>
						</div>
						<div class="form-group">
							<label for="ccnum">Card Number</label>
							<input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" required>
						</div>
						<div class="row">
							<div class="col-6">
								<div class="form-group">
									<label for="expmonth">Exp Month</label>
									<input type="text" id="expmonth" name="expmonth" placeholder="MM" required>
								</div>
							</div>
							<div class="col-3">
								<div class="form-group">
									<label for="expyear">Exp Year</label>
									<input type="text" id="expyear" name="expyear" placeholder="YY" required>
								</div>
							</div>
							<div class="col-3">
								<div class="form-group">
									<label for="cvv">CVV</label>
									<input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
								</div>
							</div>
						</div>
					</div>
				</div>
				<label style="font-weight: 500; font-size: 13.5px; text-transform: none; display: flex; align-items: center; gap: 8px;">
					<input type="checkbox" checked="checked" name="sameadr" style="width: auto !important; margin: 0 !important;"> Shipping address same as billing
				</label>
</body>
</html>
