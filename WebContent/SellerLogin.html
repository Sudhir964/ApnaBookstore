<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin & Inventory Login | ApnaBookstore</title>
	<link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
	<link rel="manifest" href="./favicons/site.webmanifest">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="styles.css">
	<style>
		.auth-wrapper {
			min-height: calc(100vh - 80px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 16px;
		}
		.auth-card {
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 16px;
			box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
			max-width: 440px;
			width: 100%;
			padding: 36px 32px;
		}
		.auth-header {
			text-align: center;
			margin-bottom: 26px;
		}
		.auth-icon {
			width: 52px;
			height: 52px;
			border-radius: 14px;
			background: #0f172a;
			color: #ffffff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 26px;
			margin: 0 auto 14px auto;
		}
		.auth-header h2 {
			font-size: 24px;
			font-weight: 700;
			color: #0f172a;
			margin-bottom: 6px;
		}
		.auth-header p {
			font-size: 14px;
			color: #64748b;
			margin: 0;
		}
		.role-switch-pill {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 10px;
			padding: 10px 14px;
			margin-bottom: 22px;
			font-size: 13.5px;
			text-align: center;
			color: #475569;
		}
		.role-switch-pill a {
			font-weight: 600;
			color: #4f46e5;
		}
		.auth-footer {
			text-align: center;
			margin-top: 22px;
			font-size: 14px;
			color: #64748b;
		}
	</style>
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-sm bg-dark">
			<a class="brand-container" href="index.html">
				<span class="brand-logo-text">ApnaBookstore</span>
				<span class="brand-badge">Store & Inventory</span>
			</a>
			
			<button class="navbar-toggler" style="background-color: white;" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">                
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
					<li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
					<li class="nav-item"><a class="nav-link" href="CustomerRegister.html">Register</a></li>
					<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
				</ul>
			</div>
		</nav>
	</header>

	<div class="auth-wrapper">
		<div class="auth-card">
			<div class="auth-header">
				<div class="auth-icon">
					<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
				</div>
				<h2>Admin & Inventory Sign In</h2>
				<p>Access store management & inventory controls</p>
			</div>

			<div class="role-switch-pill">
				Customer shopping? <a href="CustomerLogin.html">Sign In as Customer</a>
			</div>

			<form action="adminlog" method="post">
				<div class="form-group">
					<label for="userName">Admin Username</label>
					<input type="text" name="username" id="userName" placeholder="Enter admin username" required autofocus>
				</div>

				<div class="form-group">
					<label for="Password">Password</label>
					<input type="password" name="password" id="Password" placeholder="Enter password" required>
				</div>

				<button type="submit" class="AdminLogin" style="margin-top: 8px;">
					Sign In to Inventory Dashboard
				</button>
			</form>

			<div class="auth-footer">
				Need help? <a href="about.html" style="font-weight: 600;">Contact Developer</a>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
